[project]
name = "brewery-bottles"
version = "0.1.0"
description = "Homebrew bottles for Intel Macs"
authors = [{ name = "Rob Webb" }]
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff==0.17.0",             # Pinned to avoid surprise default rule set changes
    "rust-just>=1.59.0,<2.0.0",
    "ty>=0.0.101,<1.0.0",
]

[project.urls]
Repository = "https://github.com/rdawebb/brewery-bottles"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
