name: Build

on:
  workflow_call:
    inputs:
      formula:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      formula:
        description: The homebrew/core formula to build
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 330 # Under the 6h hard limit
    env:
      FORMULA: ${{ inputs.formula }} # Via env, never interpolated into a script
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      ROOT_URL: https://ghcr.io/v2/rdawebb/brewery-bottles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Set up brew with a shallow homebrew/core
        run: |
          # Drops azure-cli to prevent 'brew update' migrating it to cask version
          brew uninstall --formula --force azure-cli || true
          brew update
          core="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          rm -rf "$core"
          git clone --depth=1 https://github.com/Homebrew/homebrew-core "$core"

      - name: Install dependencies
        run: |
          # gh-pages branch, not Pages, which lags a push
          git fetch --depth=1 origin gh-pages
          git worktree add --detach pages FETCH_HEAD
          uv run python -m bottles deps --pages pages "$FORMULA" > deps.txt
          cat deps.txt
          mkdir -p deps
          while read -r image sha256 file; do
            oras blob fetch --output "deps/$file" "ghcr.io/rdawebb/brewery-bottles/$image@sha256:$sha256"
            brew install "./deps/$file"
          done < deps.txt

      - name: Build
        id: build
        run: |
          start=$(date +%s)
          echo "$start" > "$RUNNER_TEMP/start"
          brew install --build-bottle --include-test "$FORMULA"
          mkdir -p bottle
          echo $(( $(date +%s) - start )) > bottle/seconds

      - name: Test
        id: test
        run: |
          brew test "$FORMULA"
          brew linkage --test "$FORMULA"

      - name: Bottle
        working-directory: bottle
        run: brew bottle --json --no-rebuild --root-url="$ROOT_URL" "$FORMULA"

      - name: Push to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          uv run python -m bottles push bottle

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bottle/*.bottle*.tar.gz

      # Last, so a bottle JSON is uploaded only for a bottle that was pushed
      - name: Collect the result
        run: |
          mkdir -p "result/$FORMULA"
          cp bottle/*.json bottle/seconds "result/$FORMULA/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ inputs.formula }}
          path: result/
          if-no-files-found: error

      - name: Record the failure
        if: ${{ !success() }}
        env:
          REASON: ${{ job.status == 'cancelled' && 'timeout' || steps.test.outcome == 'failure' && 'test' || 'build' }}
        run: |
          start=$(cat "$RUNNER_TEMP/start" 2>/dev/null || date +%s)
          rm -rf result && mkdir -p "result/$FORMULA"
          jq -n --arg reason "$REASON" --argjson seconds $(( $(date +%s) - start )) \
            '{$reason, $seconds}' > "result/$FORMULA/failed.json"
          cat "result/$FORMULA/failed.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: result-${{ inputs.formula }}
          path: result/

  publish:
    needs: build
    if: ${{ !cancelled() }} # A failed build is recorded too
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # To start the next run
    env:
      FORMULA: ${{ inputs.formula }} # Via env, never interpolated into a script
      ROOT_URL: https://ghcr.io/v2/rdawebb/brewery-bottles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"

      # Holds `<name>/`, so gives `results/<name>/`; missing for a lost runner, which retries
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: result-${{ inputs.formula }}
          path: results

      - name: Merge and push
        env:
          TOKEN: ${{ github.token }}
        run: |
          scripts/pages.sh bash -c 'uv run python -m bottles merge pages results "$FORMULA" > added.txt'
          cat added.txt

      # Anonymously, as brewery fetches them, so a private package or broken push is caught
      - name: Check the new blobs
        run: |
          while read -r image sha256; do
            got=$(curl -sSfL -H 'Authorization: Bearer QQ==' \
              "$ROOT_URL/$image/blobs/sha256:$sha256" | sha256sum | cut -d' ' -f1)
            if [ "$got" != "$sha256" ]; then
              echo "::error::$image: expected $sha256, got $got"
              exit 1
            fi
          done < added.txt

      # Dependents may be buildable now; only a leg that published something starts a run; ends when
      # nothing more can be built
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s added.txt ]; then
            gh workflow run drain.yaml -R "$GITHUB_REPOSITORY"
          fi
