name: Build

on:
  workflow_call:
    inputs:
      formula:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      formula:
        description: The homebrew/core formula to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 330 # Under the 6h hard limit
    env:
      FORMULA: ${{ inputs.formula }} # Via env, never interpolated into a script
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      ROOT_URL: https://ghcr.io/v2/rdawebb/brewery-bottles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Set up brew with a shallow homebrew/core
        run: |
          brew update
          core="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          rm -rf "$core"
          git clone --depth=1 https://github.com/Homebrew/homebrew-core "$core"

      - name: Install dependencies
        run: |
          uv run python -m bottles deps "$FORMULA" > deps.txt
          cat deps.txt
          mkdir -p deps
          while read -r image sha256 file; do
            oras blob fetch --output "deps/$file" "ghcr.io/rdawebb/brewery-bottles/$image@sha256:$sha256"
            brew install "./deps/$file"
          done < deps.txt

      - name: Build
        run: |
          start=$(date +%s)
          brew install --build-bottle --include-test "$FORMULA"
          mkdir -p bottle
          echo $(( $(date +%s) - start )) > bottle/seconds

      - name: Test
        run: |
          brew test "$FORMULA"
          brew linkage --test "$FORMULA"

      - name: Bottle
        working-directory: bottle
        run: brew bottle --json --no-rebuild --root-url="$ROOT_URL" "$FORMULA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ inputs.formula }}
          path: bottle/
          if-no-files-found: error
